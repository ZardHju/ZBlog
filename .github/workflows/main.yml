# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  # 每次推送到 main 分支时触发部署
  push:
    branches: [main]
  # 允许你手动在 GitHub Actions 页面触发此工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发的部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # 使用 withastro/action 会自动处理 Node.js 的安装和依赖安装
        # 它也会自动上传构建产物（./dist）以便后续的部署任务使用
        with:
          # 如果你的 Astro 项目不在根目录，可以在这里指定路径，例如：path: ./my-site
          # Firefly 在根目录，所以此行可以注释掉
          # path: .
          # 明确指定包管理器为 pnpm，withastro/action 会自动根据 lockfile 检测，但显式指定更可靠
          package-manager: pnpm@latest
          # 可以指定 Node.js 版本，默认为 18，Firefly 需要 >=22，所以显式指定为 22
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
